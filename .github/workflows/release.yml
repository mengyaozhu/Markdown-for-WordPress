name: Release
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 scripts/check-version.py
      - run: npm ci
      - run: npm run check
      - run: php -l plugin/markdown-for-wordpress/markdown-for-wordpress.php
      - run: npm test
      - run: python3 scripts/package.py
      - name: Create release and upload installable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/markdown-for-wordpress-*.zip --verify-tag --title "Markdown for WordPress ${GITHUB_REF_NAME#v}" --generate-notes
